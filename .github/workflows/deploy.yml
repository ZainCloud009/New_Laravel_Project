name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath, curl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Execute Tests
        run: php artisan test

      - name: Upload Compiled Assets
        uses: actions/upload-artifact@v4
        with:
          name: compiled-assets
          path: public/build

  deploy:
    name: Deploy to AWS EC2
    needs: tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download Compiled Assets
        uses: actions/download-artifact@v4
        with:
          name: compiled-assets
          path: public/build

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # 1. Setup SSH Key
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 2. Add Host to known_hosts
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 3. Pull/Clone Repository & Composer Install on EC2
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$EC2_USER@$EC2_HOST" "GITHUB_TOKEN='$GITHUB_TOKEN' REPOSITORY='$REPOSITORY' bash -se" << 'EOF'
            set -ex

            TARGET_DIR="/var/www/html/New_Laravel_Project"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"

            echo "🚀 Starting deployment to $TARGET_DIR..."

            # Directory and Repository Clone/Pull
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📂 Target directory does not contain git repository. Cloning repository..."
              sudo mkdir -p "$TARGET_DIR" 2>/dev/null || mkdir -p "$TARGET_DIR"
              sudo chown -R $USER:$USER "$TARGET_DIR" 2>/dev/null || true
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "🔄 Repository exists. Pulling latest code..."
              cd "$TARGET_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Clean remote URL so token is not retained in git config
            git remote set-url origin "https://github.com/${REPOSITORY}.git"

            # Check and configure .env
            if [ ! -f .env ]; then
              echo "⚙️ .env file not found. Creating from .env.example..."
              cp .env.example .env
              php artisan key:generate --force
              touch database/database.sqlite
            fi

            # Install/Update Composer Dependencies (Production)
            echo "📦 Installing Composer dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          EOF

          # 4. Transfer Compiled Frontend Assets (Built in GitHub Actions with Node 22)
          echo "🎨 Syncing compiled Vite assets to EC2..."
          tar -czf - -C public build | ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" "mkdir -p /var/www/html/New_Laravel_Project/public && tar -xzf - -C /var/www/html/New_Laravel_Project/public"

          # 5. Run Migrations, Cache & Reload Web Services on EC2
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$EC2_USER@$EC2_HOST" "bash -se" << 'EOF'
            set -ex

            TARGET_DIR="/var/www/html/New_Laravel_Project"
            cd "$TARGET_DIR"

            # Run Database Migrations
            echo "🗄️ Running database migrations..."
            php artisan migrate --force

            # Optimize Laravel Cache
            echo "⚡ Optimizing application caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Set Directory Permissions
            echo "🔒 Setting directory permissions..."
            WEB_USER="www-data"
            if ! id -u www-data >/dev/null 2>&1; then
              if id -u nginx >/dev/null 2>&1; then
                WEB_USER="nginx"
              elif id -u apache >/dev/null 2>&1; then
                WEB_USER="apache"
              else
                WEB_USER="$USER"
              fi
            fi

            sudo chown -R $USER:$WEB_USER "$TARGET_DIR" 2>/dev/null || chown -R $USER "$TARGET_DIR" 2>/dev/null || true
            sudo chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache" "$TARGET_DIR/public/build" 2>/dev/null || chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache" "$TARGET_DIR/public/build" 2>/dev/null || true

            # Reload Web Services
            echo "🔄 Reloading services..."
            if sudo systemctl is-active --quiet php8.2-fpm 2>/dev/null; then
              sudo systemctl reload php8.2-fpm 2>/dev/null || true
            elif sudo systemctl is-active --quiet php-fpm 2>/dev/null; then
              sudo systemctl reload php-fpm 2>/dev/null || true
            fi

            if sudo systemctl is-active --quiet nginx 2>/dev/null; then
              sudo systemctl reload nginx 2>/dev/null || true
            elif sudo systemctl is-active --quiet apache2 2>/dev/null; then
              sudo systemctl reload apache2 2>/dev/null || true
            elif sudo systemctl is-active --quiet httpd 2>/dev/null; then
              sudo systemctl reload httpd 2>/dev/null || true
            fi

            echo "✅ Deployment completed successfully!"
          EOF
